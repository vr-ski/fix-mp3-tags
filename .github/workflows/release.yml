# This workflow is managed by gh actions-lock.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string
      do_release:
        description: "Create a (draft) GitHub Release?"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build and test distribution
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.dist.outputs.archive }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.44'

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "our \$VERSION = '$RELEASE_VERSION';" \
            lib/FixMP3Tags/Processor.pm

      - name: Install runtime dependencies
        env:
          PERL_MM_USE_DEFAULT: 1
          PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
        run: cpanm --quiet --notest -l local --installdeps .

      - name: Build and test distribution
        run: |
          set -euo pipefail
          perl Makefile.PL
          make disttest
          make dist

      - name: Verify distribution archive
        id: dist
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="FixMP3Tags-${RELEASE_VERSION}.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" >/dev/null
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: FixMP3Tags-${{ inputs.version }}
          path: ${{ steps.dist.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.do_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download distribution archive
        uses: actions/download-artifact@v8.0.2
        with:
          name: FixMP3Tags-${{ inputs.version }}
          path: artefacts

      - name: Assemble release notes
        run: |
          TAG="${{ inputs.version }}"
          REPO="https://github.com/${{ github.repository }}"

          {
            echo "# FixMP3Tags ${TAG}"
            echo ""
            echo "FixMP3Tags is a Perl utility for correcting MP3 metadata tags."
            echo ""
            echo "## Installation"
            echo ""
            echo "Download the \`FixMP3Tags-${TAG}.tar.gz\` source archive attached to this release."
            echo "Extract it, then run:"
            echo ""
            echo '```sh'
            echo "perl Makefile.PL"
            echo "make test"
            echo "make install"
            echo '```'
            echo ""
            echo "## Requirements"
            echo ""
            echo "- Perl 5.10.0 or later."
            echo "- Runtime dependencies listed in \`cpanfile\`."
            echo ""
            echo "## Source"
            echo ""
            echo "- [Repository](${REPO})"
            echo "- [Changes](${REPO}/blob/${TAG}/Changes)"
            echo "- [Issues](${REPO}/issues)"
            echo ""
            echo "## Licence"
            echo ""
            echo "See the included \`LICENSE\` file."
          } > release-notes.md

          cat release-notes.md

      - name: Create release tag if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_VERSION} already exists."
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_VERSION}" \
              -f "sha=${GITHUB_SHA}"
            echo "Created tag ${RELEASE_VERSION} at ${GITHUB_SHA}."
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_VERSION" \
            "artefacts/FixMP3Tags-${RELEASE_VERSION}.tar.gz" \
            --draft \
            --verify-tag \
            --title "FixMP3Tags ${RELEASE_VERSION}" \
            --notes-file release-notes.md
