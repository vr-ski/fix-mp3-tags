# This workflow is managed by gh actions-lock.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string
      do_release:
        description: "Create a draft GitHub Release?"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build and test distribution
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.dist.outputs.archive }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.44'

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "our \$VERSION = '$RELEASE_VERSION';" \
            lib/FixMP3Tags/Processor.pm

      - name: Install runtime dependencies
        env:
          PERL_MM_USE_DEFAULT: 1
          PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
        run: cpanm --quiet --notest -l local --installdeps .

      - name: Build and test distribution
        run: |
          set -euo pipefail
          perl Makefile.PL
          make disttest
          make dist

      - name: Verify distribution archive
        id: dist
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="FixMP3Tags-${RELEASE_VERSION}.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" >/dev/null
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: FixMP3Tags-${{ inputs.version }}
          path: ${{ steps.dist.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub Release
    needs: build
    if: inputs.do_release
    runs-on: ubuntu-latest
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7.0.0
        with:
          name: FixMP3Tags-${{ inputs.version }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" \
            "FixMP3Tags-${RELEASE_VERSION}.tar.gz" \
            --draft \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes
