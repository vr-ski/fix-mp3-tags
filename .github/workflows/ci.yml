# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Perl lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.44'

      - name: Install runtime and development dependencies
        env:
          PERL_MM_USE_DEFAULT: 1
          PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
        run: cpanm --quiet --notest -l local --installdeps --with-develop .

      - name: Spell check
        run: |
          python -m pip install --disable-pip-version-check codespell==2.4.3
          codespell README.md CONTRIBUTING.md Changes \
            lib/FixMP3Tags/Processor.pm bin/fix-mp3-tags

      - name: Perl Critic
        run: local/bin/perlcritic --quiet bin/fix-mp3-tags lib/

      - name: Check formatting
        run: |
          find bin lib \( -name '*.pl' -o -name '*.pm' \) -print0 |
            xargs -0 -r local/bin/perltidy --assert-tidy

  test:
    name: Test Perl ${{ matrix.perl }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.10', '5.44']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: ${{ matrix.perl }}

      - name: Cache CPAN modules
        uses: actions/cache@v6.1.0
        with:
          path: local
          key: ${{ runner.os }}-${{ matrix.perl }}-cpan-${{ hashFiles('cpanfile', 'Makefile.PL') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.perl }}-cpan-

      - name: Install runtime dependencies
        env:
          PERL_MM_USE_DEFAULT: 1
          PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
        run: |
          cpanm --quiet --notest -l local --installdeps .

      - name: Run tests
        run: prove -l t/

  disttest:
    name: Test CPAN distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.44'

      - name: Install dependencies
        env:
          PERL_MM_USE_DEFAULT: 1
          PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
        run: cpanm --quiet --notest -l local --installdeps .

      - name: Build and test distribution
        run: |
          perl Makefile.PL
          make disttest
